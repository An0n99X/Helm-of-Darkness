<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | default: "Helm-of-Darkness" }} — {{ page.title | default: "Security Advisory Blogs" }}</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      background: #000 url({{ "/assets/milky-way.webp" | relative_url }}) center top / cover no-repeat fixed;
      background-attachment: fixed;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    /* fade-to-black so text stays readable over the stars */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }
    .wrapper {
      max-width: 880px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    a { color: #9ecbff; }
    code, pre { background: rgba(255,255,255,0.08); }
    pre { padding: 1em; overflow: auto; border-radius: 6px; }
    img { max-width: 100%; }
    h1, h2, h3 { line-height: 1.25; }
  </style>
</head>
<body>
  <main class="wrapper">
    {{ content }}
  </main>
</body>
</html>
